<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048 · Tianqi Zhao</title>
<meta name="description" content="2048 in the colours of an afterglow image: the bigger the tile, the brighter it glows, from deep violet up to red.">
<meta name="theme-color" content="#05060f">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://tqzhaone.github.io/playground/2048/">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tqzhaone.github.io/playground/2048/">
<meta property="og:title" content="2048 · Tianqi Zhao">
<meta property="og:description" content="2048 in the colours of an afterglow image.">
<meta property="og:image" content="https://tqzhaone.github.io/assets/img/play/2048.webp">
<link rel="preload" href="/assets/fonts/fira-500.woff" as="font" type="font/woff" crossorigin>
<style>
  /*
   * 2048, in the colours of the home page's afterglow images: a tile glows brighter the bigger it
   * is, its colour climbing the radiance table from deep violet (2) to red (2048).
   */
  @font-face {
    font-family: "Cardo";
    src: url("/assets/fonts/cardo-400.woff") format("woff");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Fira Sans";
    src: url("/assets/fonts/fira-400.woff") format("woff");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Fira Sans";
    src: url("/assets/fonts/fira-500.woff") format("woff");
    font-weight: 500;
    font-display: swap;
  }

  :root {
    --night: #05060f;
    --moon: #eceff7;
    --moon-soft: #cdd2e4;
    --haze: #9aa3bf;
    --dim: #7d86a5;
    --line: rgba(236, 239, 247, 0.12);
    --line-strong: rgba(236, 239, 247, 0.24);
    --glass: rgba(9, 11, 28, 0.66);
    --phosphor: #74f7be;
    --uv: #8f6bff;
    --serif: "Cardo", "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", serif;
    --sans: "Fira Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
    --edge: 20px;
    --board: min(520px, calc(100vw - 2 * var(--edge)), calc(100vh - 250px));
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    overflow: hidden;
    background:
      radial-gradient(60% 55% at 50% 52%, #0f1230, transparent 70%),
      var(--night);
    color: var(--moon-soft);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  html[data-lang="zh"] [data-l="en"],
  html[data-lang="en"] [data-l="zh"] {
    display: none !important;
  }

  button {
    font: inherit;
    color: inherit;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  .glass {
    background: var(--glass);
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }

  .backhome {
    position: fixed;
    top: calc(var(--edge) + env(safe-area-inset-top));
    left: calc(var(--edge) + env(safe-area-inset-left));
    z-index: 3;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px 7px 11px;
    border-radius: 999px;
    color: var(--moon-soft);
    font-size: 13px;
    text-decoration: none;
  }

  .backhome:hover,
  .backhome:focus-visible {
    border-color: var(--line-strong);
    color: var(--moon);
  }

  .hud {
    position: fixed;
    top: calc(var(--edge) + env(safe-area-inset-top));
    right: calc(var(--edge) + env(safe-area-inset-right));
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    border-radius: 999px;
    font-size: 13px;
  }

  .pill {
    padding: 4px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--haze);
    font-size: 12px;
    cursor: pointer;
  }

  .pill:hover,
  .pill:focus-visible {
    border-color: var(--line-strong);
    color: var(--moon);
  }

  .pill:disabled {
    cursor: default;
    opacity: 0.4;
  }

  /* Middle: title and scores above the board. */
  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: calc(var(--edge) + 56px) var(--edge) var(--edge);
  }

  .game {
    width: var(--board);
  }

  .head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
  }

  .head h1 {
    margin: 0;
    color: var(--moon);
    font-family: var(--serif);
    font-size: 54px;
    font-weight: 400;
    line-height: 0.95;
    letter-spacing: 0.01em;
  }

  .head p {
    margin: 8px 0 0;
    color: var(--haze);
    font-size: 13px;
    text-wrap: pretty;
  }

  .scores {
    display: flex;
    gap: 8px;
  }

  .score {
    position: relative;
    min-width: 76px;
    padding: 7px 12px 6px;
    border-radius: 12px;
    text-align: center;
  }

  .score span {
    display: block;
    color: var(--dim);
    font-size: 11px;
  }

  .score b {
    display: block;
    color: var(--moon);
    font-size: 20px;
    font-weight: 500;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }

  .score__add {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    color: var(--phosphor);
    font-size: 15px;
    font-weight: 500;
    pointer-events: none;
    animation: rise 0.8s ease-out forwards;
  }

  @keyframes rise {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-26px); }
  }

  /* The board. Cells and tiles are placed by --r and --c: a tile is 1/4.6 of the board, with a
     gap of 0.12 tile around it, so each step is 112% of a tile. */
  .board {
    position: relative;
    width: var(--board);
    aspect-ratio: 1;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: linear-gradient(180deg, #0d1028, #090b1d);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .cell,
  .tile {
    position: absolute;
    top: 2.6087%;
    left: 2.6087%;
    width: 21.739%;
    height: 21.739%;
    transform: translate(calc(var(--c) * 112%), calc(var(--r) * 112%));
  }

  .cell {
    border-radius: 14%;
    background: rgba(236, 239, 247, 0.035);
    box-shadow: inset 0 0 0 1px rgba(236, 239, 247, 0.04);
  }

  .tile {
    z-index: 1;
    transition: transform 110ms ease-out;
  }

  .tile__in {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    border-radius: 14%;
    background: var(--bg);
    color: var(--fg);
    box-shadow: 0 0 var(--glow) var(--halo), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    font-size: calc(var(--t) * var(--fs));
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .tile.is-merged {
    z-index: 2;
  }

  .tile.is-new .tile__in {
    animation: appear 160ms ease-out both;
  }

  .tile.is-merged .tile__in {
    animation: pop 200ms ease-out both;
  }

  @keyframes appear {
    from { opacity: 0; transform: scale(0.3); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.16); }
    100% { transform: scale(1); }
  }

  .hint {
    margin: 14px 0 0;
    color: var(--dim);
    font-size: 13px;
    text-align: center;
    text-wrap: balance;
  }

  .hint kbd {
    display: inline-block;
    min-width: 22px;
    margin: 0 2px;
    padding: 1px 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--moon-soft);
    font: inherit;
    font-size: 12px;
    text-align: center;
  }

  .hint--touch {
    display: none;
  }

  /* Won, or no moves left: a panel over the board. */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    padding: 20px;
    border-radius: 18px;
    background: rgba(5, 6, 15, 0.72);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    text-align: center;
    animation: fade 0.4s ease-out;
  }

  .overlay[hidden] {
    display: none;
  }

  @keyframes fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .overlay h2 {
    margin: 0 0 6px;
    color: var(--moon);
    font-size: 28px;
    font-weight: 500;
  }

  .overlay p {
    margin: 0 0 18px;
  }

  .overlay__actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .btn {
    padding: 10px 20px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: transparent;
    color: var(--moon);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }

  .btn:hover {
    border-color: var(--moon-soft);
  }

  .btn--primary {
    border-color: var(--moon);
    background: var(--moon);
    color: #0a0c1e;
  }

  .btn--primary:hover {
    background: #fff;
  }

  .btn:focus-visible,
  .pill:focus-visible {
    outline: 2px solid var(--uv);
    outline-offset: 3px;
  }

  @media (max-width: 560px) {
    :root {
      --edge: 12px;
      --board: min(520px, calc(100vw - 2 * var(--edge)), calc(100vh - 230px));
    }

    .head h1 {
      font-size: 44px;
    }

    .head p {
      display: none;
    }

    .score {
      min-width: 64px;
      padding: 6px 10px 5px;
    }
  }

  @media (pointer: coarse) {
    .hint--keys {
      display: none;
    }

    .hint--touch {
      display: block;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile {
      transition: none;
    }

    .tile.is-new .tile__in,
    .tile.is-merged .tile__in,
    .score__add,
    .overlay {
      animation: none;
    }
  }
</style>
</head>
<body>
<a class="backhome glass" href="/playground/"><span aria-hidden="true">←</span><span data-l="zh">趣味</span><span data-l="en">Playground</span></a>

<div class="hud glass">
  <button class="pill" type="button" id="undo" disabled><span data-l="zh">撤销</span><span data-l="en">Undo</span></button>
  <button class="pill" type="button" id="restart"><span data-l="zh">新游戏</span><span data-l="en">New game</span></button>
  <button class="pill" type="button" id="langswitch"><span data-l="zh">EN</span><span data-l="en">中文</span></button>
</div>

<main class="stage">
  <div class="game">
    <div class="head">
      <div>
        <h1>2048</h1>
        <p data-l="zh">合并相同的方块。方块越大越亮，颜色沿首页的辐射色标从深紫一路走到红色。</p>
        <p data-l="en">Merge equal tiles. The bigger a tile, the brighter it glows, climbing the home page's radiance colours from deep violet to red.</p>
      </div>
      <div class="scores">
        <div class="score glass" id="scoreBox"><span data-l="zh">得分</span><span data-l="en">Score</span><b id="score">0</b></div>
        <div class="score glass"><span data-l="zh">最高</span><span data-l="en">Best</span><b id="best">0</b></div>
      </div>
    </div>

    <div class="board" id="board" aria-label="2048">
      <div id="cells"></div>
      <div id="tiles"></div>
      <div class="overlay" id="overlay" hidden>
        <div id="overlayBody"></div>
      </div>
    </div>

    <p class="hint hint--keys"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> <span data-l="zh">或</span><span data-l="en">or</span> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <span data-l="zh">移动，</span><span data-l="en">to move,</span> <kbd>U</kbd> <span data-l="zh">撤销一步</span><span data-l="en">to undo</span></p>
    <p class="hint hint--touch"><span data-l="zh">在棋盘上滑动来移动方块</span><span data-l="en">Swipe on the board to move the tiles</span></p>
  </div>
</main>

<p class="sr-only" aria-live="polite" id="live"></p>
<noscript><p style="position:fixed;inset:auto 0 50% 0;text-align:center">这个小游戏需要 JavaScript。 / This game needs JavaScript.</p></noscript>

<script>
(() => {
  "use strict";

  /* Language: ?lang=, then the site's remembered choice, then the browser's. ------------------ */

  let lang = "en";
  try {
    const asked = new URLSearchParams(location.search).get("lang");
    const stored = localStorage.getItem("site-lang");
    if (asked === "zh" || asked === "en") lang = asked;
    else if (stored === "zh" || stored === "en") lang = stored;
    else if (/^zh\b/i.test(navigator.language || "")) lang = "zh";
  } catch (e) {
    if (/^zh\b/i.test(navigator.language || "")) lang = "zh";
  }

  const STR = {
    zh: {
      winTitle: "点亮了 2048",
      win: "接着玩，看能不能更亮。",
      keep: "继续玩",
      overTitle: "没有能合并的了",
      over: (s) => `这局得分 ${s}。`,
      again: "再来一局",
      undo: "撤销一步",
      newGame: "新游戏",
      moved: (s) => `得分 ${s}`,
    },
    en: {
      winTitle: "2048 lit up",
      win: "Keep going and see how bright it gets.",
      keep: "Keep playing",
      overTitle: "No moves left",
      over: (s) => `You scored ${s}.`,
      again: "Play again",
      undo: "Undo a move",
      newGame: "New game",
      moved: (s) => `Score ${s}`,
    },
  };

  /* Colours: the home page's radiance table, by the tile's power of two. ----------------------- */

  const LUT = [[0, "#2b0b66"], [0.2, "#2348ff"], [0.42, "#00c8ff"], [0.62, "#36f27a"], [0.82, "#ffe34d"], [1, "#ff4530"]]
    .map(([p, hex]) => [p, [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16))]);

  function lut(v) {
    v = Math.max(0, Math.min(1, v));
    for (let i = 1; i < LUT.length; i++) {
      if (v <= LUT[i][0]) {
        const [p0, c0] = LUT[i - 1];
        const [p1, c1] = LUT[i];
        const f = (v - p0) / (p1 - p0);
        return c0.map((c, k) => Math.round(c + (c1[k] - c) * f));
      }
    }
    return LUT[LUT.length - 1][1];
  }

  function look(v) {
    const k = Math.log2(v);
    const t = Math.min(1, (k - 1) / 10);
    const c = lut(t);
    const lum = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
    const digits = String(v).length;
    return {
      bg: v > 2048 ? `linear-gradient(160deg, rgb(255,236,214), rgb(${c.join(",")}))` : `rgb(${c.join(",")})`,
      fg: lum > 0.5 || v > 2048 ? "#0a0c1e" : "#f4f2ff",
      glow: `${Math.round(3 + 2.6 * k)}px`,
      halo: `rgba(${c.join(",")},${Math.min(0.75, 0.12 + 0.055 * k).toFixed(2)})`,
      fs: digits <= 2 ? 0.44 : digits === 3 ? 0.38 : digits === 4 ? 0.3 : 0.25,
    };
  }

  /* State ------------------------------------------------------------------------------------------ */

  const $ = (id) => document.getElementById(id);
  const board = $("board");
  const tilesEl = $("tiles");
  const ui = { score: $("score"), best: $("best"), scoreBox: $("scoreBox"), undo: $("undo"), overlay: $("overlay"), overlayBody: $("overlayBody"), live: $("live") };
  const STATE_KEY = "tz-2048-state";
  const BEST_KEY = "tz-2048-best";

  let grid = []; // 4 x 4 of tiles or null
  let score = 0;
  let best = 0;
  let won = false;
  let keepPlaying = false;
  let over = false;
  let undoState = null;
  let nextId = 1;
  let pending = null; // finishing the last move's merges
  let overlayKind = null;

  try {
    best = Number(localStorage.getItem(BEST_KEY)) || 0;
  } catch (e) {}

  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.setProperty("--r", r);
      cell.style.setProperty("--c", c);
      $("cells").appendChild(cell);
    }
  }

  function makeTile(v, r, c, cls) {
    const t = { id: nextId++, v, r, c, el: document.createElement("div") };
    t.el.className = `tile${cls ? ` ${cls}` : ""}`;
    t.el.innerHTML = '<div class="tile__in"></div>';
    paint(t);
    tilesEl.appendChild(t.el);
    return t;
  }

  function paint(t) {
    const L = look(t.v);
    const s = t.el.style;
    s.setProperty("--r", t.r);
    s.setProperty("--c", t.c);
    s.setProperty("--bg", L.bg);
    s.setProperty("--fg", L.fg);
    s.setProperty("--glow", L.glow);
    s.setProperty("--halo", L.halo);
    s.setProperty("--fs", L.fs);
    t.el.firstChild.textContent = String(t.v);
  }

  function emptyCells() {
    const out = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!grid[r][c]) out.push([r, c]);
    return out;
  }

  function addRandom() {
    const free = emptyCells();
    if (!free.length) return;
    const [r, c] = free[Math.floor(Math.random() * free.length)];
    grid[r][c] = makeTile(Math.random() < 0.9 ? 2 : 4, r, c, "is-new");
  }

  function clearBoard() {
    settle();
    tilesEl.textContent = "";
    grid = Array.from({ length: 4 }, () => Array(4).fill(null));
  }

  function newGame() {
    clearBoard();
    score = 0;
    won = false;
    keepPlaying = false;
    over = false;
    undoState = null;
    addRandom();
    addRandom();
    hideOverlay();
    hud();
    save();
  }

  function snapshot() {
    return { cells: grid.map((row) => row.map((t) => (t ? t.v : 0))), score, won, keepPlaying };
  }

  function restore(st) {
    clearBoard();
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (st.cells[r][c]) grid[r][c] = makeTile(st.cells[r][c], r, c, "");
    score = st.score;
    won = !!st.won;
    keepPlaying = !!st.keepPlaying;
    over = false;
  }

  /* Moving -------------------------------------------------------------------------------------------- */

  const VEC = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };

  function move(dir) {
    if (over || (won && !keepPlaying)) return;
    settle();
    const [dr, dc] = VEC[dir];
    const before = snapshot();
    const rows = [0, 1, 2, 3];
    const cols = [0, 1, 2, 3];
    if (dr === 1) rows.reverse();
    if (dc === 1) cols.reverse();
    const merged = [];
    let moved = false;
    let gained = 0;
    for (const r of rows) {
      for (const c of cols) {
        const t = grid[r][c];
        if (!t) continue;
        let nr = r;
        let nc = c;
        while (true) {
          const rr = nr + dr;
          const cc = nc + dc;
          if (rr < 0 || rr > 3 || cc < 0 || cc > 3) break;
          const other = grid[rr][cc];
          if (!other) {
            nr = rr;
            nc = cc;
            continue;
          }
          if (other.v === t.v && !other.from) {
            // Merge: both slide into the cell, then a new tile of twice the value takes their place.
            grid[r][c] = null;
            t.r = rr;
            t.c = cc;
            // A tile made by a merge cannot merge again in the same move (2 2 4 gives 4 4, not 8).
            const m = { v: t.v * 2, r: rr, c: cc, from: [t, other] };
            grid[rr][cc] = m;
            merged.push(m);
            gained += m.v;
            moved = true;
            nr = null;
          }
          break;
        }
        if (nr === null) continue;
        if (nr !== r || nc !== c) {
          grid[r][c] = null;
          grid[nr][nc] = t;
          t.r = nr;
          t.c = nc;
          moved = true;
        }
      }
    }
    if (!moved) return;
    undoState = before;
    score += gained;
    // Slide everything that moved, including the tiles about to merge.
    for (const row of grid) for (const t of row) if (t && t.el) paint(t);
    for (const m of merged) for (const t of m.from) paint(t);
    // Then put the merged tiles in place.
    const finish = () => {
      pending = null;
      for (const m of merged) {
        for (const t of m.from) t.el.remove();
        const nt = makeTile(m.v, m.r, m.c, "is-merged");
        grid[m.r][m.c] = nt;
        if (m.v === 2048 && !won) won = true;
      }
      addRandom();
      afterMove(gained);
    };
    pending = { timer: setTimeout(finish, 110), finish };
  }

  function settle() {
    if (!pending) return;
    clearTimeout(pending.timer);
    pending.finish();
  }

  function afterMove(gained) {
    if (gained) bump(gained);
    if (score > best) {
      best = score;
      try {
        localStorage.setItem(BEST_KEY, String(best));
      } catch (e) {}
    }
    hud();
    ui.live.textContent = STR[lang].moved(score);
    if (won && !keepPlaying && overlayKind !== "win") {
      showOverlay("win");
    } else if (!canMove()) {
      over = true;
      showOverlay("over");
    }
    save();
  }

  function canMove() {
    if (emptyCells().length) return true;
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const v = grid[r][c].v;
        if ((c < 3 && grid[r][c + 1].v === v) || (r < 3 && grid[r + 1][c].v === v)) return true;
      }
    }
    return false;
  }

  function undo() {
    if (!undoState) return;
    restore(undoState);
    undoState = null;
    hideOverlay();
    hud();
    save();
  }

  /* HUD, overlay, saving ------------------------------------------------------------------------- */

  function hud() {
    ui.score.textContent = String(score);
    ui.best.textContent = String(Math.max(best, score));
    ui.undo.disabled = !undoState;
  }

  function bump(n) {
    const add = document.createElement("span");
    add.className = "score__add";
    add.textContent = `+${n}`;
    ui.scoreBox.appendChild(add);
    setTimeout(() => add.remove(), 800);
  }

  function showOverlay(kind) {
    overlayKind = kind;
    const L = STR[lang];
    let html = "";
    if (kind === "win") {
      html = `<h2>${L.winTitle}</h2><p>${L.win}</p>
        <div class="overlay__actions"><button class="btn btn--primary" type="button" data-act="keep">${L.keep}</button><button class="btn" type="button" data-act="new">${L.newGame}</button></div>`;
    } else if (kind === "over") {
      html = `<h2>${L.overTitle}</h2><p>${L.over(score)}</p>
        <div class="overlay__actions"><button class="btn btn--primary" type="button" data-act="new">${L.again}</button>${undoState ? `<button class="btn" type="button" data-act="undo">${L.undo}</button>` : ""}</div>`;
    }
    ui.overlayBody.innerHTML = html;
    ui.overlay.hidden = false;
    const btn = ui.overlayBody.querySelector(".btn--primary");
    if (btn) btn.focus({ preventScroll: true });
  }

  function hideOverlay() {
    overlayKind = null;
    ui.overlay.hidden = true;
  }

  ui.overlayBody.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-act]");
    if (!b) return;
    if (b.dataset.act === "keep") {
      keepPlaying = true;
      hideOverlay();
      save();
    } else if (b.dataset.act === "new") newGame();
    else if (b.dataset.act === "undo") undo();
  });

  function save() {
    try {
      localStorage.setItem(STATE_KEY, JSON.stringify({ ...snapshot(), over }));
    } catch (e) {}
  }

  function load() {
    try {
      const st = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
      if (st && Array.isArray(st.cells) && st.cells.length === 4 && !st.over && st.cells.flat().some((v) => v)) {
        restore(st);
        return true;
      }
    } catch (e) {}
    return false;
  }

  function applyLang() {
    document.documentElement.dataset.lang = lang;
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    if (overlayKind) showOverlay(overlayKind);
  }

  /* Size: font sizes follow the tile size. ------------------------------------------------------- */

  function sizeTiles() {
    board.style.setProperty("--t", `${board.clientWidth / 4.6}px`);
  }

  /* Input ------------------------------------------------------------------------------------------ */

  const KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    KeyW: "up", KeyS: "down", KeyA: "left", KeyD: "right",
  };

  document.addEventListener("keydown", (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const d = KEYS[ev.code];
    if (d) {
      ev.preventDefault();
      move(d);
    } else if (ev.code === "KeyU") {
      undo();
    }
  });

  let start = null;
  board.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest(".overlay")) return;
    start = { x: ev.clientX, y: ev.clientY, id: ev.pointerId };
  });
  board.addEventListener("pointerup", (ev) => {
    if (!start || ev.pointerId !== start.id) return;
    const dx = ev.clientX - start.x;
    const dy = ev.clientY - start.y;
    start = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : dy > 0 ? "down" : "up");
  });
  board.addEventListener("pointercancel", () => (start = null));

  ui.undo.addEventListener("click", undo);
  $("restart").addEventListener("click", (ev) => {
    if (ev.detail > 0) ev.currentTarget.blur();
    newGame();
  });
  $("langswitch").addEventListener("click", (ev) => {
    if (ev.detail > 0) ev.currentTarget.blur();
    lang = lang === "zh" ? "en" : "zh";
    try {
      localStorage.setItem("site-lang", lang);
    } catch (e) {}
    applyLang();
  });

  window.addEventListener("resize", sizeTiles);

  /* Go --------------------------------------------------------------------------------------------- */

  applyLang();
  sizeTiles();
  grid = Array.from({ length: 4 }, () => Array(4).fill(null));
  if (!load()) newGame();
  hud();
})();
</script>
</body>
</html>
