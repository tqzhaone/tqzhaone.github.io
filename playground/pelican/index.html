<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鹈鹕骑车 3D</title>
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<style>
/* 标题用的站酷快乐体，只子集了标题这几个字，自托管，不走外部网站 */
@font-face{
  font-family:"ZCOOL KuaiLe";

  font-weight:400;font-style:normal;font-display:swap;
}
:root{
  /* 布局：整屏 3D 舞台；左上角标题，底部居中一条胶囊控制栏 */
  --sky-top:#9dd2f3;
  --sky-mid:#d3ecfa;
  --sky-low:#fcefd8;
  --sun:#fff7dc;
  --ink:#18324f;
  --ink-soft:#4b6584;
  --panel:rgba(255,255,255,.74);
  --accent:#2a63d4;
  --font-display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--ink);font-family:var(--font-body);
  background:radial-gradient(circle at 84% 8%,var(--sun) 0,rgba(255,247,220,0) 28%),linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
#stage canvas:active{cursor:grabbing}
#stage canvas:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.head{position:absolute;top:0;left:0;padding:calc(14px + env(safe-area-inset-top)) 18px 0 calc(18px + env(safe-area-inset-left));pointer-events:none}
h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.1;letter-spacing:.03em;text-wrap:balance}
.tag{display:inline-block;margin-left:8px;padding:3px 8px 2px;border-radius:999px;background:var(--accent);color:#fff;font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:.06em;vertical-align:5px}
.hint{margin:6px 0 0;font-size:13px;color:var(--ink-soft);transition:opacity .8s ease}
.hint.gone{opacity:0}
.backhome{position:absolute;z-index:6;top:calc(14px + env(safe-area-inset-top));right:calc(18px + env(safe-area-inset-right));display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--panel);color:var(--ink);text-decoration:none;font:500 13px/1 var(--font-body);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 6px 18px rgba(24,50,79,.12),inset 0 0 0 1px rgba(255,255,255,.65);transition:color .2s ease}
.backhome:hover{color:var(--accent)}
.backhome:active{transform:scale(.96)}
.bar{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px;border-radius:999px;background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(24,50,79,.14),inset 0 0 0 1px rgba(255,255,255,.65);max-width:calc(100% - 32px)}
.bar button{appearance:none;-webkit-appearance:none;border:0;margin:0;padding:0;width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:transparent;color:var(--ink);cursor:pointer}
.bar button:hover{background:rgba(24,50,79,.08)}
.bar button[aria-pressed="true"]{background:var(--accent);color:#fff}
.bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar svg.solid{fill:currentColor;stroke:none}
.bar svg.off{display:none}
.speed{display:flex;align-items:center;gap:8px;padding:0 4px;font-size:13px;color:var(--ink-soft)}
.speed input{width:min(32vw,140px);margin:0;accent-color:var(--accent)}
.speed output{min-width:36px;font-variant-numeric:tabular-nums;color:var(--ink)}
#msg{position:absolute;inset:0;margin:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:15px;color:var(--ink-soft);pointer-events:none}
#msg[hidden]{display:none}
@media (max-width:350px){.speed label{display:none}}
</style>

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 90);

  var UP = new THREE.Vector3(0, 1, 0);
  var tA = new THREE.Vector3(), tB = new THREE.Vector3(), tD = new THREE.Vector3();
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  /* 金属反光用的简易环境贴图：上天蓝、地平线暖白、下草绿，外加一个太阳亮斑 */
  var envTex = null;
  try {
    var pm = new THREE.PMREMGenerator(renderer);
    var envScene = new THREE.Scene();
    var eg = new THREE.SphereGeometry(10, 32, 16), ep = eg.getAttribute('position'), ecol = [];
    var eTop = new THREE.Color(0.42, 0.62, 0.95), eHor = new THREE.Color(1.0, 0.97, 0.92), eBot = new THREE.Color(0.16, 0.3, 0.12), ec = new THREE.Color();
    for (var ei = 0; ei < ep.count; ei++) {
      var ey = ep.getY(ei) / 10;
      if (ey >= 0) ec.copy(eHor).lerp(eTop, Math.pow(ey, 0.55)); else ec.copy(eHor).lerp(eBot, Math.pow(-ey, 0.45));

    }

    envScene.add(new THREE.Mesh(eg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));

    envScene.add(sunBall);
    envTex = pm.fromScene(envScene, 0.02).texture;
    pm.dispose();
  } catch (err) { envTex = null; }

  function mat(hex, o) {
    o = o || {};
    var m = new THREE.MeshStandardMaterial({ color: lin(hex), roughness: o.r == null ? 0.8 : o.r, metalness: o.m || 0 });
    if (o.env && envTex) { m.envMap = envTex; m.envMapIntensity = o.env; }
    if (o.flat) m.flatShading = true;
    if (o.ds) m.side = THREE.DoubleSide;
    if (o.em) { m.emissive = lin(o.emc || hex); m.emissiveIntensity = o.em; }
    return m;
  }
  function metal(hex, r) {
    var m = new THREE.MeshStandardMaterial({ color: lin(hex), roughness: r, metalness: envTex ? 0.9 : 0.3 });
    if (envTex) m.envMap = envTex;
    return m;
  }
  function vmat(o) {
    o = o || {};
    var m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: o.r == null ? 0.85 : o.r, metalness: 0 });
    if (o.flat) m.flatShading = true;
    if (o.ds) m.side = THREE.DoubleSide;
    return m;
  }
  var MAT = {
    frame: mat('#2A63D4', { r: 0.3, m: 0.1, env: 0.55 }),
    cream: mat('#EAE0CB', { r: 0.42, ds: true }),
    tire: mat('#26272B', { r: 0.9 }),
    chrome: metal('#D9DEE4', 0.22),
    steel: metal('#8F959E', 0.4),
    dark: metal('#3F434A', 0.5),
    leather: mat('#6E4024', { r: 0.55 }),
    reflector: mat('#D8332B', { r: 0.4, em: 0.25 }),
    feather: mat('#EFEDE6', { r: 0.92, ds: true }),
    tailF: mat('#E4E1D8', { r: 0.92 }),
    black: mat('#232325', { r: 0.75, ds: true }),
    pouch: mat('#F2AE55', { r: 0.5, ds: true }),
    leg: mat('#EE9A33', { r: 0.55, ds: true }),
    iris: mat('#F4E39A', { r: 0.3 }),
    pupil: mat('#121214', { r: 0.15 }),
    eyeSkin: mat('#EFAF80', { r: 0.6 }),
    crest: mat('#EFDDA4', { r: 0.85 }),
    glint: mat('#FFFFFF', { r: 0.2, em: 1.2 }),
    fish: mat('#82A9CF', { r: 0.35, m: 0.35, env: 0.9 }),
    fin: mat('#577FA8', { r: 0.5, ds: true }),
    water: mat('#4FA9DA', { r: 0.12, env: 1.0 }),
    cloud: mat('#FFFFFF', { r: 1, em: 0.32, emc: '#EAF4FF' }),

  /* ---------- 几何工具 ---------- */
  function V(a) { return new THREE.Vector3(a[0], a[1], a[2] || 0); }

      seg(L.tars, c.ankle, [c.heel[0] + 0.012, c.heel[1] + 0.006, c.heel[2]]);
      L.foot.position.set(c.heel[0], c.heel[1], c.heel[2]);
    });
    rotor.rotation.z = -simT * 1.4;
    clouds.rotation.y = simT * 0.012;
    birds.forEach(function (b) {
      var ph = b.p + simT * b.w, dir = b.w > 0 ? 1 : -1;
      b.g.position.set(Math.cos(ph) * b.r, b.y + 0.12 * Math.sin(simT * 1.3 + b.p), Math.sin(ph) * b.r);
      b.g.rotation.set(0, Math.atan2(-Math.cos(ph) * dir, -Math.sin(ph) * dir), 0);
      var f = 0.55 * Math.sin(simT * 9 + b.p * 3);
      b.wings.forEach(function (w) { w.g.rotation.x = -w.s * f; });
    });
    if (nPtr === 0) { view.tAz += velAz * dt; velAz *= Math.exp(-3.2 * dt); if (Math.abs(velAz) < 0.01) velAz = 0; }
    if (autoSpin && nPtr === 0 && now - lastInteract > 2500) view.tAz += dt * 0.12;
    var kk = 1 - Math.exp(-dt * 10);
    view.az += (view.tAz - view.az) * kk; view.el += (view.tEl - view.el) * kk; view.zoom += (view.tZoom - view.zoom) * kk;
    placeCamera();
    /* 云飘到镜头跟前或挡住视线时缩小消失，离开后再长回来 */
    tB.subVectors(target, camera.position);
    var sightLen = tB.length(); tB.multiplyScalar(1 / sightLen);
    cloudList.forEach(function (c) {
      c.m.position.y = c.y + 0.08 * Math.sin(simT * 0.5 + c.ph);
      c.m.getWorldPosition(tA);
      var dCam = tA.distanceTo(camera.position);
      tD.subVectors(tA, camera.position);
      var along = tD.dot(tB), off = along > 0 && along < sightLen + 1 ? tD.addScaledVector(tB, -along).length() : 9;
      var s = Math.min(smooth01((dCam - 2.2) / 1.8), smooth01((off - 1.0) / 1.0));
      c.m.visible = s > 0.01;
      c.m.scale.setScalar(Math.max(0.01, s));
    });
    renderer.render(scene, camera);
    if (firstFrame) { firstFrame = false; msgEl.hidden = true; }
  }
  resize();
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  renderer.setAnimationLoop(frame);
})();
</script>
