name: Deploy site

# Publishes site/ to the gh-pages branch, which GitHub Pages serves.
# One build step first: tools/build-site.js writes the News, Blog and Photos pages from their content
# (site/news/news.json, site/blog/<post>/index.md, site/photos/photos.json). It needs only Node, which
# the runner already has. Everything else in site/ goes online as it is.

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "tools/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the News, Blog and Photos pages
        run: node tools/build-site.js

      - name: Publish site/ to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean: true
