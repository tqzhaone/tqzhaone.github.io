name: Deploy site

# Publishes site/ to the gh-pages branch, which GitHub Pages serves.
# Two build steps first, both needing only Node, which the runner already has:
#   tools/citations.js fetches each paper's citation count (OpenAlex, else Crossref) for the
#   Publications page; if that fails the site still goes up, keeping the last counts or none.
#   tools/build-site.js writes the News, Blog, Photos, Publications and Playground pages from their
#   content (site/news/news.json, site/blog/<post>/index.md, site/photos/photos.json, ...).
# Everything else in site/ goes online as it is. It also runs once a day, to refresh the counts.

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "tools/**"
      - ".github/workflows/deploy.yml"
  schedule:
    - cron: "17 19 * * *" # every day at 03:17 Beijing time: fresh citation counts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Fetch citation counts
        run: node tools/citations.js
        continue-on-error: true
        env:
          # optional; without it the counts come from Crossref (see tools/citations.js)
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

      - name: Build the News, Blog, Photos, Publications and Playground pages
        run: node tools/build-site.js

      - name: Publish site/ to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean: true
